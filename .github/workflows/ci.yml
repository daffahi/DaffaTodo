# Nama yang tampil di tab Actions di GitHub
name: CI

# Kapan workflow ini jalan: setiap push ke main, dan setiap pull request yang menuju main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hak akses minimal untuk workflow ini: hanya boleh membaca isi repo
permissions:
  contents: read

jobs:
  # Job pertama: backend. Job berjalan sejajar dengan job lain, masing-masing di komputer virtual sendiri
  backend:
    name: Backend (build and test)
    runs-on: ubuntu-latest

    steps:
      # Mengunduh kode repo ke komputer virtual
      - name: Checkout
        uses: actions/checkout@v4

      # Memasang .NET SDK. 10.0.x = versi 10 terbaru, sama dengan yang dipakai di proyek
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Mengunduh package NuGet
      - name: Restore
        run: dotnet restore DaffaTodo.slnx

      # Build mode Release, sama seperti yang nanti dipakai saat deploy
      - name: Build
        run: dotnet build DaffaTodo.slnx --configuration Release --no-restore

      # --no-build = pakai hasil build di atas, tidak build ulang
      - name: Test
        run: dotnet test DaffaTodo.slnx --configuration Release --no-build

  # Job kedua: frontend
  frontend:
    name: Frontend (lint and build)
    runs-on: ubuntu-latest

    # Semua perintah "run" di job ini dijalankan dari dalam folder client
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Memasang Node.js. Vite butuh versi 20.19+ atau 22.12+, jadi dipakai 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Simpan cache package npm antar run, supaya run berikutnya lebih cepat
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm ci = pasang package persis sesuai package-lock.json (lebih ketat dan reproducible daripada npm install)
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build