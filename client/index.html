<!doctype html>
<html lang="en">
  <head>
    <!-- Encoding teks, supaya karakter khusus tampil benar -->
    <meta charset="UTF-8" />
    <!-- Ikon kecil di tab browser. File vite.svg ada di folder public -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Supaya tampilan menyesuaikan lebar layar HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Judul di tab browser. Tempatnya di head, bukan di body -->
    <title>DaffaTodo</title>
  </head>
  <body>
    <!-- Tempat React menggambar seluruh aplikasi -->
    <div id="root"></div>
    <!-- Memuat titik awal aplikasi (main.tsx). Kalau baris ini hilang, halaman jadi kosong -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
